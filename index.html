<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HARPIA Nutrição Animal | Catálogo de Formulações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Barra Superior Verde Escura -->
  <header class="top-navbar">
    <div class="top-navbar-inner">
      <div class="brand-group">
        <img src="logo-harpia.jpg" alt="Logo Harpia Nutrição Animal" class="brand-logo-thumb harpia-logo-img" />
        <div class="brand-titles-wrap">
          <div class="brand-main-line">
            <span class="brand-harpia">HARPIA</span>
            <span class="brand-nutricao">NUTRIÇÃO ANIMAL</span>
          </div>
          <span class="brand-sub">Apresentação Técnica das Novas Formulações</span>
        </div>
      </div>

      <button class="btn-download-pdf" onclick="downloadCatalogPDF()">
        Baixar Catálogo em PDF
      </button>
    </div>
  </header>

  <!-- Sub-Header Branco com Título, Busca, Abas e Ações Rápidas -->
  <section class="sub-header">
    <div class="sub-header-inner">
      <div class="sub-header-row-1">
        <div class="catalog-heading">
          <h1>Catálogo de Formulações</h1>
          <p>Consulte os produtos em lista interativa ou em formato de tabela com visualização dos benefícios ao clicar.</p>
        </div>

        <div class="search-box-wrap">
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Buscar por produto, categoria, aditivo..."
          />
        </div>
      </div>

      <div class="sub-header-row-2">
        <div class="segmented-tabs" role="tablist">
          <button id="btnTabList" class="seg-tab active" onclick="setView('list')">
            Lista Interativa
          </button>
          <button id="btnTabTable" class="seg-tab" onclick="setView('table')">
            Tabela com Benefícios
          </button>
        </div>

        <div class="quick-actions">
          <span class="quick-actions-label">Ações rápidas:</span>
          <button class="btn-quick" onclick="expandAll()">Expandir Todos</button>
          <button class="btn-quick" onclick="collapseAll()">Recolher Todos</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Área Principal -->
  <main class="main-content">
    <div class="status-bar">
      <div id="showingCountText" class="showing-text">Mostrando <strong>13</strong> formulações</div>
      <span class="pill-linha-completa">Linha Harpia Completa</span>
    </div>

    <!-- Visualização 1: Lista Interativa -->
    <div id="listViewContainer" class="interactive-list"></div>

    <!-- Visualização 2: Tabela com Benefícios -->
    <div id="tableViewContainer" style="display: none;"></div>
  </main>

  <!-- Área de Impressão / PDF Informativo com Logo -->
  <div id="printArea" aria-hidden="true"></div>

  <script src="logo.js"></script>
  <script src="app.js"></script>
</body>
</html>
